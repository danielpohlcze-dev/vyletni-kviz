name: Human trip experience audit
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/human-trip-audit.yml'
      - 'app/src/main/**'
      - 'app/src/androidTest/java/cz/ctuprotebe/vyletnikviz/TripExperienceAuditTest.java'
      - 'app/build.gradle'

jobs:
  human-trip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Povolit hardwarovou akceleraci emulátoru
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Projít aplikaci jako výletník
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle connectedQualityAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cz.ctuprotebe.vyletnikviz.TripExperienceAuditTest
            mkdir -p app/build/human-audit-screens
            adb pull /sdcard/Android/data/cz.ctuprotebe.vyletnikviz.quality271/files/test-screens/. app/build/human-audit-screens/
      - name: Uložit lidský UX audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-trip-audit
          path: |
            app/build/human-audit-screens/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
