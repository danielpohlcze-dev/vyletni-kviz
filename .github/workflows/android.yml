name: Sestavit Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: mkdir -p test-out && javac -d test-out app/src/main/java/cz/ctuprotebe/vyletnikviz/GameRules.java tests/GameRulesTest.java && java -cp test-out GameRulesTest
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vyletni-kviz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
  android-ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Povolit hardwarovou akceleraci emulátoru
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Nainstalovat APK a proklikat aplikaci
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle connectedDebugAndroidTest || (adb logcat -d > app/build/emulator-logcat.txt && exit 1)
      - name: Uložit důkazy z emulátoru
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/emulator-logcat.txt
