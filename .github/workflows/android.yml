name: Sestavit Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'tests/release-apk-smoke.py'
      - '.github/workflows/release-apk.yml'
      - 'tests/evidence/**'
      - 'releases/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Ověřit veřejný přístup na nasazený server bez AI volání
        run: |
          set -u
          BASE='https://vyletni-kviz-api-ylr7h4.v2.appdeploy.ai'
          echo '--- health GET ---'
          curl -sS -D /tmp/h1 -o /tmp/b1 "$BASE/api/_healthcheck" || true
          head -n 1 /tmp/h1 || true
          cat /tmp/b1 || true
          echo
          echo '--- POST invalid token, native-like ---'
          curl -sS -D /tmp/h2 -o /tmp/b2 -X POST "$BASE/api/generate" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'X-App-Token: invalid' \
            -H 'User-Agent: Dalvik/2.1.0 (Linux; U; Android 16)' \
            --data '{"request_id":"vk27_probe_123456789","context":{},"plan":[]}' || true
          head -n 1 /tmp/h2 || true
          cat /tmp/b2 || true
          echo
          echo '--- POST invalid token, browser-origin-like ---'
          curl -sS -D /tmp/h3 -o /tmp/b3 -X POST "$BASE/api/generate" \
            -H 'Content-Type: application/json' \
            -H 'X-App-Token: invalid' \
            -H "Origin: $BASE" \
            -H "Referer: $BASE/" \
            --data '{"request_id":"vk27_probe_123456789","context":{},"plan":[]}' || true
          head -n 1 /tmp/h3 || true
          cat /tmp/b3 || true
          echo
      - name: Ověřit server 2.7 bez placeného API
        run: |
          node --check server/worker.js
          node tests/server-worker-test.mjs
      - run: mkdir -p test-out && javac -d test-out app/src/main/java/cz/ctuprotebe/vyletnikviz/GameRules.java tests/GameRulesTest.java && java -cp test-out GameRulesTest
      - run: gradle testQualityUnitTest assembleQuality
      - run: gradle -p live-test test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-unit-test-results
          path: app/build/test-results/testQualityUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: Vyletni-kviz-APK
          path: app/build/outputs/apk/quality/app-quality.apk
      - name: Uložit veřejný nástroj pro závěrečný podpis APK
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signing-tool
          path: signing-tools/apksigner.jar
  android-ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Povolit hardwarovou akceleraci emulátoru
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Nainstalovat APK a proklikat aplikaci
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tests/run-android-ui.sh
      - name: Uložit důkazy z emulátoru
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/emulator-logcat.txt
            app/build/ui-screenshots/
