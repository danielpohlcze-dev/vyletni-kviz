name: Sestavit Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'tests/release-apk-smoke.py'
      - '.github/workflows/release-apk.yml'
      - 'tests/evidence/**'
      - 'releases/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Ověřit produkční AppDeploy API bez AI volání
        run: |
          set -euo pipefail
          API='https://api-v2.appdeploy.ai/app/vyletni-kviz-api-ylr7h4'
          HEALTH=$(curl -sS -o /tmp/health -w '%{http_code}' "$API/api/_healthcheck")
          echo "health=$HEALTH $(cat /tmp/health)"
          if [ "$HEALTH" = '402' ]; then echo 'AppDeploy gateway is credit-limited; app failover path will handle this.'; else test "$HEALTH" = '200'; fi
          DENIED=$(curl -sS -o /tmp/denied -w '%{http_code}' -X POST "$API/api/generate" -H 'Content-Type: application/json' --data '{"app_token":"invalid","request_id":"vk27_ci_probe_123456789","context":{},"plan":[]}')
          echo "invalid-token=$DENIED $(cat /tmp/denied)"
          if [ "$DENIED" = '402' ]; then echo 'AppDeploy gateway credit-limited before route.'; else test "$DENIED" = '401'; fi
      - name: Diagnostika již selhaného AI E2E requestu bez nového generování
        run: |
          set -euo pipefail
          API='https://api-v2.appdeploy.ai/app/vyletni-kviz-api-ylr7h4'
          cat > /tmp/live.json <<'JSON'
          {
            "app_token":"vk27_server_bridge_2026_09",
            "request_id":"vk27_android_ai_live_20260917_001",
            "as_of":"2026-09-17",
            "context":{"players":[{"name":"Barča","topic":"Psychologie","color":1},{"name":"Dominik","topic":"Lední hokej","color":2}],"title":"E2E test výletního kvízu","date":"17. 09. 2026","note":"diagnostika","photos":[],"count":10,"diff":"Vyvážená","cats":["Česko","Svět","Historie","Příroda","Věda a technika","Kultura"],"strong":true,"strongEvery":3,"bizarre":true,"bizarreEvery":5,"sound":false},
            "plan":[
              {"slot":1,"assigned_player":"Barča","requested_topic":"Historie – Česko","mode":"vseobecny","hard":false,"difficulty":"Vyvážená"},
              {"slot":2,"assigned_player":"Dominik","requested_topic":"Příroda – svět","mode":"vseobecny","hard":false,"difficulty":"Vyvážená"},
              {"slot":3,"assigned_player":"Barča","requested_topic":"Věda a technika – Česko","mode":"vseobecny","hard":false,"difficulty":"Vyvážená"},
              {"slot":4,"assigned_player":"Dominik","requested_topic":"Kultura – svět","mode":"vseobecny","hard":false,"difficulty":"Vyvážená"},
              {"slot":5,"assigned_player":"Barča","requested_topic":"Bizarní svět – pravdivý překvapivý fakt","mode":"bizarni","hard":false,"difficulty":"Vyvážená"},
              {"slot":6,"assigned_player":"Dominik","requested_topic":"Zeměpis – Česko","mode":"vseobecny","hard":true,"difficulty":"Vyvážená"},
              {"slot":7,"assigned_player":"Barča","requested_topic":"Historie – svět","mode":"vseobecny","hard":false,"difficulty":"Vyvážená"},
              {"slot":8,"assigned_player":"Dominik","requested_topic":"Gastronomie – Česko","mode":"vseobecny","hard":false,"difficulty":"Vyvážená"},
              {"slot":9,"assigned_player":"Barča","requested_topic":"Psychologie","mode":"silny_okruh","hard":true,"difficulty":"Vyvážená"},
              {"slot":10,"assigned_player":"Dominik","requested_topic":"Lední hokej","mode":"silny_okruh","hard":true,"difficulty":"Vyvážená"}
            ]
          }
          JSON
          CODE=$(curl -sS -o /tmp/live-body -w '%{http_code}' -X POST "$API/api/generate" -H 'Content-Type: application/json' --data-binary @/tmp/live.json)
          echo "diagnostic-status=$CODE"
          cat /tmp/live-body
          echo
          if [ "$CODE" = '402' ]; then echo 'Expected while AppDeploy gateway is credit-limited.'; else test "$CODE" = '502'; fi
      - run: mkdir -p test-out && javac -d test-out app/src/main/java/cz/ctuprotebe/vyletnikviz/GameRules.java tests/GameRulesTest.java && java -cp test-out GameRulesTest
      - run: gradle testQualityUnitTest assembleQuality
      - run: gradle -p live-test test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-unit-test-results
          path: app/build/test-results/testQualityUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: Vyletni-kviz-APK
          path: app/build/outputs/apk/quality/app-quality.apk
      - name: Uložit veřejný nástroj pro závěrečný podpis APK
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signing-tool
          path: signing-tools/apksigner.jar
  android-ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Povolit hardwarovou akceleraci emulátoru
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Nainstalovat APK, proklikat UI a ověřit Android na produkčním API
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tests/run-android-ui.sh
      - name: Uložit důkazy z emulátoru
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/emulator-logcat.txt
            app/build/ui-screenshots/
