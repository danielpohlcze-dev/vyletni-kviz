plugins { id 'com.android.application' }

android {
    namespace 'cz.ctuprotebe.vyletnikviz'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.ctuprotebe.vyletnikviz'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '2.5.0'
        manifestPlaceholders = [appLabel: 'Výletní kvíz']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // The previous CI debug signing key is unavailable. This variant installs alongside it,
    // preserving the user's original app, credentials and trip history.
    buildTypes {
        quality {
            initWith debug
            applicationIdSuffix '.quality'
            manifestPlaceholders = [appLabel: 'Výletní kvíz 2.5']
            matchingFallbacks = ['debug']
        }
    }
    testBuildType 'quality'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}
