plugins { id 'com.android.application' }

android {
    namespace 'cz.ctuprotebe.vyletnikviz'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.ctuprotebe.vyletnikviz'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '2.7.4'
        manifestPlaceholders = [appLabel: 'Výletní kvíz']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // The original production signing key is not available in CI. This fixed test
    // variant therefore installs alongside older builds instead of risking their data.
    buildTypes {
        quality {
            initWith debug
            applicationIdSuffix '.quality274'
            manifestPlaceholders = [appLabel: 'Výletní kvíz 2.7.4']
            matchingFallbacks = ['debug']
        }
    }
    testBuildType 'quality'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}
